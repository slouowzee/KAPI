version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    main: ./main.go
    binary: kapi
    ldflags:
      - -s -w -X github.com/slouowzee/kapi/internal/updater.version={{ .Tag }}

archives:
  - formats:
    - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

homebrew_casks:
  - name: kapi
    repository:
      owner: slouowzee
      name: homebrew-kapi
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: GoReleaser Bot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/slouowzee/kapi"
    description: "A Go-based interactive TUI CLI for project scaffolding"
    hooks:
      post:
        # The binary is not notarized: drop the quarantine flag on macOS.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kapi"]
          end

nfpms:
  - id: kapi
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    homepage: "https://github.com/slouowzee/kapi"
    description: "A Go-based interactive TUI CLI for project scaffolding"
    maintainer: "slouowzee"
    license: "MIT"
    vendor: "slouowzee"
    formats:
      - deb
      - rpm
      - apk
      - archlinux

scoops:
  - name: kapi
    repository:
      owner: slouowzee
      name: scoop-bucket
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    commit_author:
      name: GoReleaser Bot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    homepage: "https://github.com/slouowzee/kapi"
    description: "A Go-based interactive TUI CLI for project scaffolding"

aurs:
  - name: kapi-bin
    homepage: "https://github.com/slouowzee/kapi"
    description: "A Go-based interactive TUI CLI for project scaffolding"
    maintainers:
      - "slouowzee <slouowzee@gmail.com>"
    license: "MIT"
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: "ssh://aur@aur.archlinux.org/kapi-bin.git"
